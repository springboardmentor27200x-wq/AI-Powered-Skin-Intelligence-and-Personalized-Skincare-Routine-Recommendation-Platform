version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: skin_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin_backend
    restart: always
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres123@db:5432/skin_intelligence
      - JWT_SECRET_KEY=super-secret-key-change-later
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
