services:
  db:
    image: postgres:15-alpine
    container_name: skin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: skin_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No need to expose 5432 publicly in production

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin_backend
    restart: always
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres123@db:5432/skin_intelligence
      - JWT_SECRET_KEY=super-secret-key-change-later
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: